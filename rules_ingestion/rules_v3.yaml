# Prefer profiles/balanced.yaml; this file remains as a legacy alias for older
# scripts that still pass --profile rules_v3.yaml.
ruleset_version: "v3"
policy_id: balanced
policy_class: balanced
source_sheet: "Norma_Pagos_v3"
description: >
  Legacy alias of profiles/balanced.yaml (Vendor Payments Norm v3).
  Prefer: make rules POLICY=balanced

precedence: ["NO_PAGAR", "ESCALAR", "PAGAR"]

verdict_semantics:
  PASS: "PAGAR"
  NEEDS_REVIEW: "ESCALAR"
  FAIL: "on_fail"

metrics:
  policy_class: balanced
  risk_appetite: 0.50
  escalation_bias: 0.55
  authorization_threshold_eur: null
  iban_mismatch_on_fail: ESCALAR
  soft_duplicate_verdict: NEEDS_REVIEW
  amount_tolerance_eur: 0.01
  require_erp_pending: true
  enforce_payment_terms: true
  check_nif_control_digit: true
  enable_authorization: false
  enable_new_rules_default: false

rules:
  VENDOR:
    enabled: true
    params:
      require_active: true
      require_nif_in_master: true
      require_iban_match: true
      check_nif_control_digit: true
    on_fail: ESCALAR

  DUPLICATES:
    enabled: true
    params:
      hard_key: ["invoice_number", "vendor_id"]
      soft_key: ["amount", "date"]
      require_erp_pending: true
      soft_duplicate_verdict: NEEDS_REVIEW

  AMOUNT:
    enabled: true
    params:
      tolerance_eur: 0.01
      check_line_items_sum: true
      check_iva: true
      check_total_is_base_plus_iva: true
      check_matches_pedido: true
      allowed_currencies: ["EUR"]

  DATES:
    enabled: true
    params:
      allow_future: false
      enforce_payment_terms: true

  MISSING:
    enabled: true
    params:
      required_fields: ["nif", "iban", "pedido", "importe", "iva", "fecha"]

  AUTHORIZATION:
    enabled: false
    params:
      escalate_above_eur: 10000.0
