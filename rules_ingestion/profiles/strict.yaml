# strict.yaml · aggressive / low-tolerance posture
#
# Prefer hard stops (NO_PAGAR) over escalation. Lower authorization threshold,
# IBAN mismatch is fraud-certain, soft duplicates become FAIL, NEW rules can
# start enabled. Higher risk_appetite for auto-rejection, lower escalation_bias.

policy_id: strict
policy_class: strict
ruleset_version: "v3"
source_sheet: "Norma_Pagos_v3"
description: >
  Strict / aggressive posture. Hard-fail on fraud signals and duplicates;
  require human approval above a low amount threshold; prefer NO_PAGAR to ESCALAR.

precedence: ["NO_PAGAR", "ESCALAR", "PAGAR"]

verdict_semantics:
  PASS: "PAGAR"
  NEEDS_REVIEW: "ESCALAR"
  FAIL: "on_fail"

metrics:
  policy_class: strict
  risk_appetite: 0.85
  escalation_bias: 0.25
  authorization_threshold_eur: 5000.0
  iban_mismatch_on_fail: NO_PAGAR
  soft_duplicate_verdict: FAIL
  amount_tolerance_eur: 0.01
  require_erp_pending: true
  enforce_payment_terms: true
  check_nif_control_digit: true
  enable_authorization: true
  enable_new_rules_default: true

rules:
  VENDOR:
    enabled: true
    params:
      require_active: true
      require_nif_in_master: true
      require_iban_match: true
      check_nif_control_digit: true
    on_fail: NO_PAGAR

  DUPLICATES:
    enabled: true
    params:
      hard_key: ["invoice_number", "vendor_id"]
      soft_key: ["amount", "date"]
      require_erp_pending: true
      soft_duplicate_verdict: FAIL

  AMOUNT:
    enabled: true
    params:
      tolerance_eur: 0.01
      check_line_items_sum: true
      check_iva: true
      check_total_is_base_plus_iva: true
      check_matches_pedido: true
      allowed_currencies: ["EUR"]

  DATES:
    enabled: true
    params:
      allow_future: false
      enforce_payment_terms: true

  MISSING:
    enabled: true
    params:
      required_fields: ["nif", "iban", "pedido", "importe", "iva", "fecha"]

  AUTHORIZATION:
    enabled: true
    params:
      escalate_above_eur: 5000.0
