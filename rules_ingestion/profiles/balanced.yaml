# balanced.yaml · default v3 posture (matches Norma_Pagos_v3)
#
# Middle ground: follow the written norm, escalate on doubt, do not invent
# hard blocks beyond what the norm implies. AUTHORIZATION stays OFF.

policy_id: balanced
policy_class: balanced
ruleset_version: "v3"
source_sheet: "Norma_Pagos_v3"
description: >
  Balanced v3 posture. Mirrors the written vendor-payment norm: pay when
  checks pass, escalate on doubt, never invent extra hard blocks.

precedence: ["NO_PAGAR", "ESCALAR", "PAGAR"]

verdict_semantics:
  PASS: "PAGAR"
  NEEDS_REVIEW: "ESCALAR"
  FAIL: "on_fail"

# Fingerprint for future UI / dashboards (also recomputed by policy_metrics.py).
metrics:
  policy_class: balanced
  risk_appetite: 0.50
  escalation_bias: 0.55
  authorization_threshold_eur: null
  iban_mismatch_on_fail: ESCALAR
  soft_duplicate_verdict: NEEDS_REVIEW
  amount_tolerance_eur: 0.01
  require_erp_pending: true
  enforce_payment_terms: false
  check_nif_control_digit: false
  enable_authorization: false
  enable_new_rules_default: true
  # The written norm sets the parameters of the rule it activates: a sheet that
  # states a 5.000 EUR approval threshold moves the threshold (and switches
  # AUTHORIZATION on), instead of the number living only here. Every value is
  # recorded with its source cell in the ruleset trace.
  sheet_authored_params: true

rules:
  VENDOR:
    enabled: true
    params:
      # Insatisfacible sobre La Caja: ninguna de las 14 hojas del Excel tiene
      # columna de estado del proveedor, y sources.yaml no declara ninguna.
      # Con true, R1 sale BLOCKED (UNUSABLE_INPUT: supplier.active) en el 100%
      # de las facturas. A2 tampoco lo pide.
      require_active: false
      require_nif_in_master: true
      require_iban_match: true
      # A2 dice: "Pagar solo si el NIF esta en el maestro y el IBAN de la
      # factura coincide con el maestro." Pide PERTENENCIA al maestro, no
      # validez registral: el digito de control es un bloqueo que la norma no
      # escribe. Sobre La Caja lo fallan 10 de 11 proveedores (datos
      # sinteticos), asi que activarlo tumba R1 en 425 de 471 facturas.
      check_nif_control_digit: false
    on_fail: ESCALAR

  DUPLICATES:
    enabled: true
    params:
      hard_key: ["invoice_number", "vendor_id"]
      soft_key: ["amount", "date"]
      require_erp_pending: true
      soft_duplicate_verdict: NEEDS_REVIEW

  AMOUNT:
    enabled: true
    params:
      tolerance_eur: 0.01
      check_line_items_sum: true
      check_iva: true
      check_total_is_base_plus_iva: true
      check_matches_pedido: true
      allowed_currencies: ["EUR"]
      # Caja orders omit currency; require explicit EUR on the invoice.
      # Never manufacture a missing invoice currency or override a conflict.
      order_currency_policy: invoice

  DATES:
    enabled: true
    params:
      allow_future: false
      # A5 dice, entera: "La fecha debe ser valida y no futura." No menciona
      # plazos de pago. Exigirlos aqui hace NEEDS_REVIEW en 458 de 471 (toda
      # factura anterior a las condiciones del proveedor), por una regla que
      # la norma no contiene.
      enforce_payment_terms: false

  MISSING:
    enabled: true
    params:
      required_fields: ["nif", "iban", "pedido", "importe", "iva", "fecha"]

  AUTHORIZATION:
    enabled: false
    params:
      escalate_above_eur: 10000.0
