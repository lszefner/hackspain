# conservative.yaml · high-escalation / cautious posture
#
# Prefer ESCALAR over auto PAGAR or hard NO_PAGAR. Wider amount tolerance,
# softer IBAN handling, high authorization threshold, payment terms advisory
# only. Lowest risk_appetite for auto-pay; highest escalation_bias.

policy_id: conservative
policy_class: conservative
ruleset_version: "v3"
source_sheet: "Norma_Pagos_v3"
description: >
  Conservative posture. When in doubt, escalate. Soften hard fails into
  human review; keep authorization on but at a high threshold.

precedence: ["NO_PAGAR", "ESCALAR", "PAGAR"]

verdict_semantics:
  PASS: "PAGAR"
  NEEDS_REVIEW: "ESCALAR"
  FAIL: "on_fail"

metrics:
  policy_class: conservative
  risk_appetite: 0.25
  escalation_bias: 0.85
  authorization_threshold_eur: 25000.0
  iban_mismatch_on_fail: ESCALAR
  soft_duplicate_verdict: NEEDS_REVIEW
  amount_tolerance_eur: 1.00
  require_erp_pending: true
  enforce_payment_terms: false
  check_nif_control_digit: false
  enable_authorization: true
  enable_new_rules_default: false

rules:
  VENDOR:
    enabled: true
    params:
      require_active: true
      require_nif_in_master: true
      require_iban_match: true
      check_nif_control_digit: false
    on_fail: ESCALAR

  DUPLICATES:
    enabled: true
    params:
      hard_key: ["invoice_number", "vendor_id"]
      soft_key: ["amount", "date"]
      require_erp_pending: true
      soft_duplicate_verdict: NEEDS_REVIEW

  AMOUNT:
    enabled: true
    params:
      tolerance_eur: 1.00
      check_line_items_sum: true
      check_iva: true
      check_total_is_base_plus_iva: true
      check_matches_pedido: true
      allowed_currencies: ["EUR"]

  DATES:
    enabled: true
    params:
      allow_future: false
      enforce_payment_terms: false

  MISSING:
    enabled: true
    params:
      required_fields: ["nif", "iban", "pedido", "importe", "fecha"]

  AUTHORIZATION:
    enabled: true
    params:
      escalate_above_eur: 25000.0
