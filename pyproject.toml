[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invoice-ingestion-agent"
version = "0.1.0"
description = "Evidence-linked invoice extraction with durable Supabase jobs"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<0.29",
    "jsonschema>=4.23,<5",
    "psycopg[binary,pool]>=3.2,<4",
    "pypdfium2>=4.30,<5",
    "python-dotenv>=1.0,<2",
    "Pillow>=11,<12",
]

[project.scripts]
invoice-agent = "ingestion.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
