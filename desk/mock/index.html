  const eur0 = n => '€' + Math.round(n).toLocaleString('en-GB');
  const worst = Math.max(...d.rules.map(r => r.n), 1);
  const here = d.versions.find(x => x.v === d.version) || {};
  const a = d.against;

  const opt = (list, sel, none) =>
    (none ? `<option value=""${sel ? '' : ' selected'}>${none}</option>` : '') +
    list.map(x => `<option value="${esc(x.v)}"${x.v === sel ? ' selected' : ''}>${esc(x.v)}${
      x.v === d.in_force ? ' · in force' : ''}</option>`).join('');

  const delta = r => {
    if (r.delta === undefined) return '';
    if (r.new) return `<span class="tag">new here</span>`;
    if (!r.delta) return `<span class="dl">same</span>`;
    return `<span class="dl ${r.delta > 0 ? 'up' : 'dn'}">${r.delta > 0 ? '+' : '−'}${Math.abs(r.delta)}</span>`;
  };

  const swing = (k, cls, key) => {
    const now = d.tally[key].n, was = a.tally[key].n, dd = now - was;
    return `<div class="sw2 ${cls}"><div class="k7">${k}</div>
      <div class="n7"><span class="was7">${was}</span><span class="arr">→</span>
        <span class="now7">${now}</span>

             : '<span class="dl">same</span>'}</div>

        <h2>Rules</h2>
        <p>Every invoice goes through this list, in this order. Pick a version to see what it

           off the result — not off the release note.</p>

    <div class="vbar">
      <select id="rv">${opt(d.versions, d.version, '')}</select>
      <span class="vx">compared with</span>
      <select id="rvs">${opt(d.versions.filter(x => x.v !== d.version), RV.vs, 'nothing')}</select>
      <span class="vnote">${esc(here.title || '')}</span>
      <span class="vcount">${d.checked} checked · ${d.tally.PAY.n} pay ·
        ${d.tally.ESCALATE.n} review · ${d.tally['DO NOT PAY'].n} stopped</span>
    </div>

    ${a ? `<div class="dif">
      <div class="dif-head">
        <h3>${esc(a.version)} → ${esc(d.version)} · ${a.moved.length
          ? `${a.moved.length} of ${d.checked} land differently`
          : 'not one of the 500 lands differently'}</h3>
        <p>${esc(here.title || '')} · ${esc(here.when || '')}${here.said
          ? ` · you said: <span class="said2">“${esc(here.said)}”</span>` : ''}</p>
      </div>
      <div class="swing">
        ${swing('Pay', 'pay', 'PAY')}
        ${swing('Needs you', 'rev', 'ESCALATE')}
        ${swing('Do not pay', 'stop', 'DO NOT PAY')}
      </div>
      <div class="dif-body">
        ${!a.moved.length
          ? `<div class="none7">The change is real, but nothing in this box touches it. Every one of

          : `<div class="moved">
            <div class="mh"><span>File</span><span>Supplier</span>
              <span style="text-align:right">Amount</span><span>${esc(a.version)} → ${esc(d.version)}</span>
              <span>What decided it</span></div>
            ${moved.map(m => `<div class="mr2" data-file="${esc(m.file)}">
              <span class="c">${esc(m.file)}</span>
              <span class="c sup">${esc(m.vendor)}</span>
              <span class="c am2">${esc(money(m.total))}</span>
              <span class="swap"><span class="kk was">${esc(m.was)}</span>
                <span class="arr">→</span>
                <span class="kk ${esc(m.now.replace(/[^A-Z]/g, ''))}">${esc(m.now)}</span></span>
              <span class="c why2">${esc(m.why)}</span>
            </div>`).join('')}
            ${a.moved.length > moved.length
              ? `<button class="more" id="more-moved">The other ${a.moved.length - moved.length}</button>`
              : ''}
            <div class="amt3" style="margin-top:12px">${esc(eur0(a.moved_eur))} of invoice value

          </div>`}
      </div>
    </div>` : ''}

    <div class="chain">${d.rules.map(r => `
      <div class="rule" data-rule="${esc(r.name)}">
        <button class="rule-top" type="button">

            <span class="tk"><i style="width:${r.n ? Math.max(6, r.n / worst * 100) : 0}%"></i></span>
            <span class="nq${r.n ? '' : ' zero'}">${r.n}</span></span>
          <span class="cv3"></span>
        </button>
        <div class="rule-body"><div class="in3"><div class="pad3">${esc(r.note)}
          <div class="amt3">${r.n
            ? `stopped ${r.n} of ${d.checked} · ${esc(eur0(r.eur))} held back · ${r.share}% of the box`
            : (r.added ? 'added from a cluster, nothing has hit it yet'
                       : 'nothing in the box fails this one')}${
            r.delta !== undefined && !r.new && r.changed
              ? ` · under ${esc(a.version)} it was ${esc(r.was_effect)}` : ''}${
            r.new ? ` · ${esc(a.version)} did not run this rule at all` : ''}</div>
        </div></div></div>
      </div>`).join('')}</div>

    <div class="hist"><h3>What changed · ${d.history.length}</h3>
      ${d.history.map(h => `<div class="hr2">
        <span class="vj">${esc(h.from)} → ${esc(h.to)}</span>
        <span><span class="tt">${esc(h.title)}</span>${h.said
          ? `<div class="qq">you said: “${esc(h.said)}”</div>` : ''}</span>
        <span class="wn">${esc(h.when)}</span></div>`).join('')}</div>`;

  $('#rv').onchange = e => { RV.v = e.target.value; RV.shown = 25;
                             if (RV.vs === RV.v) RV.vs = ''; loadRules(); };
  $('#rvs').onchange = e => { RV.vs = e.target.value; RV.shown = 25; loadRules(); };
  const more = $('#more-moved');
  if (more) more.onclick = () => { RV.shown += 60; loadRules(); };
  rulesReady = true;
}

$('#view-rules').addEventListener('click', e => {
  const mv = e.target.closest('.moved .mr2');
  if (mv) return openDossier(mv.dataset.file);
  const top = e.target.closest('.rule-top');
  if (top) top.closest('.rule').classList.toggle('open');
});

/* ───────────────── drop anywhere */
const ov = $('#dropov'), main = document.querySelector('.main');
let dc = 0;
main.addEventListener('dragenter', e => { e.preventDefault(); dc++; ov.classList.add('on'); });
main.addEventListener('dragover', e => e.preventDefault());
main.addEventListener('dragleave', () => { if (--dc <= 0){ dc = 0; ov.classList.remove('on'); } });
main.addEventListener('drop', e => {
  e.preventDefault(); dc = 0; ov.classList.remove('on');
  const f = e.dataTransfer && e.dataTransfer.files;
  if (f && f.length) addFiles(f);
});

refreshSend();
$('#q').focus();
</script>
</body>
</html>
