  R5_estado_erp: {FALLA: NO_PAGAR}   # ya pagado: nunca dos veces
  R2_pedido:     {FALLA: ESCALAR}
  R3_iva:        {FALLA: ESCALAR}
  R4_fecha:      {FALLA: ESCALAR}
# Regla 6: cualquier anomalia que un humano deba ver -> ESCALAR con motivo.
datos_incompletos: ESCALAR
