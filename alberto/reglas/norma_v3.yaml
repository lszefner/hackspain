# Norma de Pagos a Proveedores v3 (la vigente el viernes).
# El sabado a las 18:00 llega la v4: se copia este fichero, se edita, y se
# reprocesa. Si hay que tocar codigo para eso, el diseno ha fallado.
version: v3
reglas:
  - id: R1_nif_iban
    descripcion: El NIF esta en el maestro y el IBAN de la factura coincide con el del maestro
    requiere: [nif_emisor, iban]
    tipo: nif_iban

  - id: R2_pedido
    descripcion: El pedido existe, pertenece al proveedor y el importe coincide con el del pedido
    requiere: [pedido, total]
    tipo: pedido_importe
    tolerancia: "0.01"
    campo_importe: total      # medido sobre la Caja: el ERP casa con el TOTAL, nunca con la base
    fuente: erp               # el Excel dice ABIERTO en los 516: no sirve como estado

  - id: R3_iva
    descripcion: El IVA esta bien calculado y el total es base mas IVA
    requiere: [base, iva_importe, total]
    tipo: iva
    tolerancia: "0.01"
    iva_estandar: "21"

  - id: R4_fecha
    descripcion: La fecha es valida y no futura
    requiere: [fecha]
    tipo: fecha

  - id: R5_estado_erp
    descripcion: El pedido esta PENDIENTE en el ERP (nunca pagar dos veces)
    requiere: [pedido]
    tipo: estado_erp
    estado_pagable: PENDIENTE
