# Tarifas DECLARADAS. Los tokens son MEDIDOS (salen de la respuesta del
# proveedor); la tarifa la ponemos nosotros aqui porque el endpoint no
# devuelve coste: la rama main lo documenta explicitamente.
#
# Cuando alguien pregunte en la defensa: "tokens medidos, tarifa declarada,
# las dos cosas versionadas en el repo". No se presenta una cifra como si el
# proveedor la hubiera facturado.
version: 1
fecha: "2026-09-19"
fuente: "tarifas de lista del gateway; no verificadas contra factura"
eur_por_usd: 0.92

# EUR por millon de tokens.
modelos:
  gemma4:     {entrada: 0.14, salida: 0.28}
  qwen3.6:    {entrada: 0.09, salida: 0.18}
  por_defecto: {entrada: 0.50, salida: 1.50}   # modelo no tarifado: se sobreestima
